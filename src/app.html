      property="og:description"
      content="Perpetual markets that settle like tokens."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://stipflip.xyz/og-preview.png" />
    <meta
      property="og:image:secure_url"
      content="https://stipflip.xyz/og-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Stip & Flip - perpetual markets that settle like tokens."
    />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Perpetual markets that settle like tokens."
    />
    <meta name="twitter:image" content="https://stipflip.xyz/og-preview.png" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />

    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Ensure the background covers the entire viewport */
      background-size: cover;
      background-attachment: fixed;
    }
    body {
      /* Apply padding for safe areas */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }
  </style>
  <body data-sveltekit-preload-data="hover" class="overflow-x-hidden">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
